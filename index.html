  <style>
    :root {
      color-scheme: light;
      --ink: #111114;
      --muted: #625f72;
      --surface: #f7f6ff;
      --card: rgba(255, 255, 255, 0.86);
      --accent: #6155f5;
      --accent-dark: #4c41db;
      --line: rgba(17, 17, 20, 0.1);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(97, 85, 245, 0.2), transparent 34rem),
        radial-gradient(circle at 86% 78%, rgba(255, 192, 139, 0.18), transparent 30rem),
        var(--surface);
    }
    a { color: inherit; }
    .skip-link {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 10;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      color: #fff;
      background: var(--ink);
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }
    .shell { width: min(100% - 2rem, 72rem); margin-inline: auto; }
    .site-header { padding-block: 1.25rem; }
    .brand {
      min-height: 3rem;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .brand img { width: 5.25rem; height: auto; display: block; }
    main {
      min-height: calc(100vh - 10rem);
      padding-block: clamp(3rem, 10vw, 8rem);
      display: grid;
      place-items: center;
    }
    .hero {
      width: min(100%, 56rem);
      padding: clamp(2rem, 6vw, 5rem);
      border: 1px solid var(--line);
      border-radius: clamp(1.5rem, 4vw, 3rem);
      background: var(--card);
      box-shadow: 0 1.5rem 4rem rgba(54, 45, 139, 0.16);
      backdrop-filter: blur(1rem);
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent-dark);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 11ch;
      margin: 0;
      font-size: clamp(3.25rem, 11vw, 7.5rem);
      line-height: 0.86;
      letter-spacing: -0.075em;
    }
    .lead {
      max-width: 36rem;
      margin: clamp(1.5rem, 4vw, 2.5rem) 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      line-height: 1.55;
    }
    .actions {
      margin-top: clamp(2rem, 5vw, 3rem);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .button {
      min-height: 3.25rem;
      padding: 0.9rem 1.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 750;
      text-decoration: none;
      transition: transform 160ms ease, background-color 160ms ease;
    }
    .button-primary {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 0.8rem 1.8rem rgba(97, 85, 245, 0.26);
    }
    .button-secondary { border-color: var(--line); background: #fff; }
    .button:hover { transform: translateY(-2px); }
    .button-primary:hover { background: var(--accent-dark); }
    .button:focus-visible {
      outline: 3px solid rgba(97, 85, 245, 0.4);
      outline-offset: 3px;
    }
    footer { padding-block: 1.5rem 2rem; color: var(--muted); font-size: 0.88rem; }
    .footer-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
    }
    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
      .button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержанию</a>
  <header class="site-header">
    <div class="shell">
      <a class="brand" href="/" aria-label="THE БОТ — главная">
        <img src="/logo.png" alt="THE БОТ" width="249" height="169">
      </a>
    </div>
  </header>
  <main id="main" class="shell">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Единая платформа</p>
      <h1 id="hero-title">THE БОТ</h1>
      <p class="lead">Единая точка входа в продукты THE БОТ.</p>
      <div class="actions">
        <a class="button button-primary" href="https://core.the-bot.ru/auth/start">Войти</a>
        <a class="button button-secondary" href="/schools/">Для онлайн-школ</a>
      </div>
    </section>
  </main>
  <footer>
    <div class="shell footer-row">
      <span>© 2026 THE БОТ</span>
      <a href="mailto:hello@the-bot.ru">hello@the-bot.ru</a>
    </div>
  </footer>
